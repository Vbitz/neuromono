name: Neurodesktop ARM64 candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neurodesktop-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      IMAGE_REF: neurodesktop-candidate:run-${{ github.run_id }}-${{ github.run_attempt }}-arm64
    steps:
      - name: Checkout exact Neuromono revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout pinned public Neurodesktop source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          git submodule update --init -- neurodesktop
          expected=$(git rev-parse HEAD:neurodesktop)
          actual=$(git -C neurodesktop rev-parse HEAD)
          test "$actual" = "$expected"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          mkdir -p candidate
          printf '%s\n' "$actual" > candidate/neurodesktop-commit.txt
          printf '%s\n' "$GITHUB_SHA" > candidate/neuromono-commit.txt
      - name: Make room on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build standard Dockerfile from pinned source
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./neurodesktop
          file: ./neurodesktop/Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE_REF }}
          build-args: |
            VCS_REF=${{ steps.source.outputs.sha }}
            NEURODESKTOP_VERSION=candidate-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record and verify exact built image
        env:
          BUILT_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          actual=$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")
          test "$actual" = "$BUILT_IMAGE_ID"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$actual")" = linux/arm64
          echo "IMAGE_ID=$actual" >> "$GITHUB_ENV"
          printf '%s\n' "$actual" > candidate/image-id.txt
          printf '%s\n' "$IMAGE_REF" > candidate/image-tag.txt
          docker image inspect "$actual" > candidate/image-inspect.json
      - name: Scan exact candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_ID }}
          format: table
          output: candidate/trivy.txt
          exit-code: '1'
          severity: CRITICAL
          trivyignores: ./neurodesktop/.trivyignore.yaml
          timeout: 25m0s
          skip-files: /opt/rclone-v1.60.1-linux-amd64/README.txt,/opt/rclone-v1.60.1-linux-amd64/README.html,/opt/rclone-v1.60.1-linux-amd64/rclone.1,/opt/code-server/lib/vscode/package.json,/opt/code-server/lib/vscode/extensions/handlebars/package.json
      - name: Retain scan diagnostics even on failure
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neurodesktop-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/trivy.txt
            candidate/image-inspect.json
            candidate/image-id.txt
            candidate/image-tag.txt
            candidate/neurodesktop-commit.txt
            candidate/neuromono-commit.txt
          if-no-files-found: error
          retention-days: 3
      - name: Validate Slurm with default permissions
        working-directory: neurodesktop
        run: bash scripts/verify_slurm_image.sh "$IMAGE_ID"
      - name: Permit nested containers on disposable runner
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/neurodesktop-userns-policy"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Validate installed image and package-only sudo
        working-directory: neurodesktop
        run: bash .github/scripts/validate_image_runtime.sh "$IMAGE_ID" regular true packages false
      - name: Validate foreign UID and HPC startup
        working-directory: neurodesktop
        run: bash .github/scripts/validate_image_runtime.sh "$IMAGE_ID" hpc
      - name: Export tested image and provenance
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")" = "$IMAGE_ID"
          docker image save "$IMAGE_REF" | gzip -1 > candidate/neurodesktop-arm64.tar.gz
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record = {
              "neuromono_commit": os.environ["GITHUB_SHA"],
              "neurodesktop_commit": os.environ["SOURCE_SHA"],
              "platform": "linux/arm64",
              "image_id": os.environ["IMAGE_ID"],
              "image_tag": os.environ["IMAGE_REF"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "checks": ["critical-vulnerability-scan", "slurm", "regular-no-cvmfs", "hpc"],
              "native_crumblecracker_acceptance": "not run",
          }
          Path("candidate/provenance.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
          (cd candidate && sha256sum neurodesktop-arm64.tar.gz provenance.json image-inspect.json image-id.txt image-tag.txt neurodesktop-commit.txt neuromono-commit.txt trivy.txt > SHA256SUMS)
          {
            echo '### Tested ARM64 candidate'
            echo "Neurodesktop: $SOURCE_SHA"
            echo "Image ID: $IMAGE_ID"
            echo 'Download the artifact, verify SHA256SUMS, and decompress the archive before importing into CrumbleCracker.'
            echo 'Native Glass display, clipboard, resize, and persistence acceptance remain separate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload tested candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neurodesktop-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - name: Restore host user namespace policy
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/neurodesktop-userns-policy" ]; then
            read -r policy < "$RUNNER_TEMP/neurodesktop-userns-policy"
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$policy"
          fi
      - name: Remove candidate from disposable runner
        if: always()
        run: docker image rm "$IMAGE_REF" || true
